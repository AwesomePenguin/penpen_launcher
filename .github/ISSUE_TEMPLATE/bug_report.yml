name: Bug Report
description: Report a bug or issue in PenPen Launcher
title: '[BUG] '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢您报告bug！请填写以下信息帮助我们快速定位和解决问题。
        
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: 简要描述问题的现象和影响
      placeholder: 描述您遇到的问题...
    validations:
      required: true
      
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: 选择受影响的组件
      options:
        - Core API
        - Main UI  
        - Overlay UI
        - Watchdog Service
        - Process Manager
        - Frontend
        - Deployment
        - Other
    validations:
      required: true
      
  - type: input
    id: python_version
    attributes:
      label: Python Version
      placeholder: 例如：3.11.0
    validations:
      required: false
      
  - type: input
    id: nodejs_version
    attributes:
      label: Node.js Version (if frontend related)
      placeholder: 例如：20.9.0
    validations:
      required: false
      
  - type: dropdown
    id: controller
    attributes:
      label: Controller Type
      options:
        - DualShock 4 (DS4)
        - DualSense (DS5)
        - Not applicable
    validations:
      required: false
      
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: 详细描述重现问题的步骤
      placeholder: |
        1. 步骤一
        2. 步骤二
        3. 步骤三
        4. 观察到的问题
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: 描述期望的正确行为
    validations:
      required: true
      
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: 描述实际发生的错误行为
    validations:
      required: true
      
  - type: textarea
    id: logs
    attributes:
      label: Error Messages/Logs
      description: 粘贴相关的错误信息或日志
      render: text
    validations:
      required: false
      
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: 其他相关信息或上下文
    validations:
      required: false